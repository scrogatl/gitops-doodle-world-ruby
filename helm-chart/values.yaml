name: doodle-world-ruby
replicaCount: 1
labels:
  app.kubernetes.io/name: doodle-world-ruby
  app.kubernetes.io/instance: world-ruby-xyzz
  app.kubernetes.io/version: "0.9.1"
  app.kubernetes.io/component: service
  app.kubernetes.io/part-of: helloworld
image:
  repository: ghcr.io/scrogatl/doodle-world-ruby
  tag: main
  pullPolicy: Always
containerName: doodle-world-ruby
command:
- bundle
- exec
- rackup
- "--host"
- 0.0.0.0
- "-p"
- '5003'
env:
- name: SHARD
  value: blue
ports:
- containerPort: 5003
  name: application
  protocol: TCP
service:
  name: doodle-world-ruby
  type: ClusterIP
  ports:
  - name: http
    appProtocol: http
    port: 5003
